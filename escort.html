<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fffaf3">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Your Table | Fumito &amp; Risa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Caveat:wght@700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --red: #e0243c;
  --frame: #e04049;
  --pink: #ff6b96;
  --purple: #a641e0;
  --gold: #c9a227;
  --ink: #1a1a1a;
  --text: #3f3357;
  --text-light: #8a7fa0;
  --line: #d8cfe4;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: 'Noto Sans JP', sans-serif;
  color: var(--text);
  background: #fffaf3;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}

.stage {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
}

.wrap {
  width: 100%;
  max-width: 380px;
  margin: 0 auto;
}

.card { background: transparent; }

.card.framed {
  border: 18px solid var(--frame);
  border-radius: 30px;
  background: #fff;
  padding: clamp(14px, 4vw, 20px) clamp(8px, 2.4vw, 12px) clamp(16px, 4vw, 22px);
  box-shadow: 0 10px 30px rgba(224, 64, 73, 0.10);
}

.head { position: relative; }

.title {
  font-family: 'Playfair Display', serif;
  font-weight: 800;
  font-size: clamp(1.5rem, 7.6vw, 2rem);
  color: var(--ink);
  line-height: 1.1;
  white-space: nowrap;
}

.bird {
  position: absolute;
  right: -4px;
  top: -14px;
  width: clamp(46px, 15vw, 62px);
  transform: rotate(-6deg);
  pointer-events: none;
}

.ask-lead {
  margin-top: 30px;
  font-size: 0.82rem;
  line-height: 2;
  letter-spacing: 0.03em;
}

.ask-note { font-size: 0.71rem; color: var(--text-light); margin-top: 4px; }

.field {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  margin-top: 20px;
  padding: 16px 18px;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  background: #fff;
  font-family: inherit;
  font-size: 1.05rem;
  letter-spacing: 0.08em;
  text-align: center;
  color: var(--text);
}
.field:focus { outline: none; border-color: var(--purple); }
.field::placeholder { color: #c3bad3; letter-spacing: 0.06em; }

.go {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  margin-top: 14px;
  min-height: 60px;
  border: 0;
  border-radius: 999px;
  font-family: inherit;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: #fff;
  background: linear-gradient(135deg, var(--pink), var(--purple) 60%, #7b34e0);
  box-shadow: 0 10px 26px rgba(166,65,224,0.3);
  cursor: pointer;
  touch-action: manipulation;
}
.go:active { transform: scale(0.98); }
.go:disabled { opacity: 0.6; transform: none; }

.msg {
  display: none;
  margin-top: 16px;
  padding: 13px 14px;
  border-radius: 12px;
  background: #fdecf2;
  color: #c22b58;
  font-size: 0.76rem;
  line-height: 1.9;
}
.msg.show { display: block; }

.card-img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 46svh;
  object-fit: contain;
  margin: 0 auto;
}

.card-fallback {
  display: grid;
  place-items: center;
  min-height: 34svh;
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--red);
  letter-spacing: 0.06em;
}

.tables { margin-top: clamp(34px, 9vw, 48px); }

.table-row {
  display: flex;
  justify-content: center;
  gap: clamp(10px, 3.4vw, 16px);
}
.table-row + .table-row { margin-top: clamp(10px, 3vw, 15px); }

.seat {
  position: relative;
  width: clamp(52px, 16.5vw, 66px);
  aspect-ratio: 1;
  border: 1.6px solid var(--gold);
  border-radius: 50%;
  display: grid;
  place-items: center;
}

.seat.mine { border-color: var(--frame); border-width: 2px; }
.seat.mine .mark { display: block; }

.mark {
  display: none;
  width: 56%;
  color: var(--ink);
}

.here {
  position: absolute;
  left: 50%;
  bottom: calc(100% + 5px);
  transform: translateX(-58%);
  font-family: 'Caveat', cursive;
  font-size: 1.16rem;
  color: var(--pink);
  white-space: nowrap;
  display: flex;
  align-items: flex-end;
  gap: 1px;
}
.here svg { width: 15px; margin-bottom: 1px; }

.again {
  -webkit-appearance: none;
  appearance: none;
  display: block;
  margin: clamp(12px, 3vw, 18px) auto 0;
  padding: 10px 26px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--text-light);
  font-family: inherit;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  cursor: pointer;
}

.play .card-img,
.play .card-fallback { animation: fadeUp 0.6s ease both; }
.play .tables { animation: fadeUp 0.6s ease 0.14s both; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.play .seat.mine .mark {
  animation: markPop 0.72s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s both;
}

@keyframes markPop {
  0%   { opacity: 0; transform: scale(0.25) rotate(-16deg); }
  55%  { opacity: 1; transform: scale(1.16) rotate(4deg); }
  100% { opacity: 1; transform: scale(1) rotate(0deg); }
}

.play .seat.mine::after {
  content: '';
  position: absolute;
  inset: -5px;
  border-radius: 50%;
  border: 2px solid var(--frame);
  opacity: 0;
  animation: ring 1.3s ease-out 0.62s 2 both;
  pointer-events: none;
}

@keyframes ring {
  0%   { opacity: 0.7; transform: scale(0.82); }
  100% { opacity: 0;   transform: scale(1.3); }
}

.play .seat.mine .here {
  animation:
    hereIn 0.5s cubic-bezier(0.34, 1.4, 0.64, 1) 1.02s both,
    hereBlink 1.4s ease-in-out 1.52s infinite;
}

@keyframes hereIn {
  from { opacity: 0; transform: translateX(-58%) translateY(-9px) rotate(-8deg); }
  to   { opacity: 1; transform: translateX(-58%) translateY(0) rotate(0deg); }
}

@keyframes hereBlink {
  0%, 100% { opacity: 1;    transform: translateX(-58%) scale(1); }
  50%      { opacity: 0.32; transform: translateX(-58%) scale(0.95); }
}

@media (prefers-reduced-motion: reduce) {
  .play .card-img,
  .play .card-fallback,
  .play .tables,
  .play .seat.mine .mark,
  .play .seat.mine .here { animation: none; }
  .play .seat.mine::after { display: none; }
}

[hidden] { display: none !important; }
</style>
</head>
<body>

<div class="stage">
<div class="wrap">
<div class="card" id="card">

  <section id="askView">
    <div class="head">
      <h1 class="title">Your Table is ...</h1>
      <img class="bird" src="img/bird.png" alt="">
    </div>

    <p class="ask-lead">
      お名前を <strong>ひらがな</strong> でご入力ください<br>
      <span class="ask-note">例：やまだたろう</span>
    </p>

    <input class="field" id="nameInput" type="text" autocomplete="off"
           autocapitalize="off" spellcheck="false" placeholder="やまだたろう">

    <button type="button" class="go" id="goBtn">さがす</button>

    <p class="msg" id="msg"></p>
  </section>

  <section id="resultView" hidden>
    <div id="cardSlot"></div>
    <div class="tables" id="tables"></div>
    <button type="button" class="again" id="againBtn">もう一度さがす</button>
  </section>

</div>
</div>
</div>

<script>

const TABLES = {
  donald: { label: 'ドナルドダック', img: 'escort_img/donald.png', color: '#416fd0' },
  mickey: { label: 'ミッキーマウス', img: 'escort_img/mickey.png', color: '#e04049' },
  minnie: { label: 'ミニーマウス',   img: 'escort_img/minnie.png', color: '#f265c4' },
  pluto:  { label: 'プルート',       img: 'escort_img/pluto.png',  color: '#f9bd59' },
  goofy:  { label: 'グーフィー',     img: 'escort_img/goofy.png',  color: '#467804' },
  dale:   { label: 'デール',         img: 'escort_img/dale.png',   color: '#c79e55' },
  chipp:  { label: 'チップ',         img: 'escort_img/chipp.png',  color: '#7c562d' },
};

const LAYOUT = [
  ['donald', 'mickey', 'minnie', 'pluto'],
  ['goofy', 'dale', 'chipp'],
];

const SALT = '8249a23ba8fc2cfe7da1023a8620f89f';
const ITERATIONS = 600000;

const GUESTS = {
  '58991336aaa37e6450b8bbd478022fcf': 'pluto',
  'e9db23b998cc7c6c7a903bbb2edde4ff': 'donald',
  '97e92c577e65d6e93d70ae6726f5f31e': 'dale',
  'ab29f89b48f91edc562611d6546310ea': 'goofy',
  '1306153cc743ce8bbff45a8ce940c607': 'chipp',
  'd15998bcb351bcd4f3af90e0ec81940e': 'pluto',
  '8316f2f198c264237f5eaf3101da4c06': 'pluto',
  '126411596ee23684105ba3f1d7a02e66': 'donald',
  '93569a900b9f15a298d8e3389ae687dd': 'minnie',
  '5372249363b1a0c1e3d688cdbdc5827a': 'goofy',
  'f4be5657ebf1c9b0796c436f9394387c': 'mickey',
  '4a931a08380e36553e9f3a00615e9e69': 'dale',
  '3877ea687cd7e65400d7c8b2ee3afadb': 'donald',
  '1b5a34bafd3a38307aa2c09fc731f39f': 'dale',
  'ab34c46db80a38033e90f50a4d4e86bb': 'minnie',
  '92b82bff98daf56b8dec50ee3526c088': 'pluto',
  'bc1cb4533853afc1166f1fc005dc868f': 'mickey',
  'c90a3c27723368a958eb9d60d814f380': 'goofy',
  '140e8d4ae8e1e10eb58ccf2a04832790': 'minnie',
  '70402338bf3709a53402c96cd495c45c': 'pluto',
  '7cadf247e0f115d9c7db426c0bbf17f4': 'donald',
  'ad9ee2df4ca0907877f0204b721c8d25': 'dale',
  'a03ec2f69fe71f26b1c6f3ef32c5e480': 'mickey',
  'a7b2f14d7d9ce6570f8000acba0e1173': 'mickey',
  'b019290a8b69ea861ba083a0492f2d24': 'chipp',
  'a72c572751d08c78d923aaea38144291': 'donald',
  '96dbda0ed070b52844a1bce945af0e45': 'minnie',
  'c5f6e9363f612454d06277ffa294ce65': 'donald',
  '7851908ae57d1d0369584311e91fe1d8': 'dale',
  '597030121abdd4be1773c699a0e7a1b0': 'goofy',
  '0956e50f35297ebe9e0646c643d18607': 'chipp',
  '5a29765e8a0fd585a10efb862b442998': 'minnie',
  'f16641748f9f440688f8500e414d8e39': 'minnie',
  '25a6d0c7094617f0aaf1bc894be9d493': 'mickey',
  '00ac3e63a8a93f545aff4d09dc0cf1bb': 'pluto',
  '1823fe90074e383b982f07e678c14bd7': 'chipp',
  '7d44156db8edc1f4fa316b6904bb6b0c': 'minnie',
  '5d0dd37d31a5cbca6b93f06f241bd58a': 'chipp',
  'e246be69bf33f3bd184cc0c88bd3be5c': 'donald',
  '15367bdef0f519cdb3d86baf192f9bfc': 'goofy',
  'c83e382f0d8283ce32da13ac39df5269': 'donald',
  'd575f9dd7d11ee1eb81ea6d02dad1d18': 'goofy',
  'df4fb4d52ddc4c01c41526082ced10ca': 'mickey',
  '1716d17ddc1861d1a48815ac55822b79': 'mickey',
  'b8bb8783373120301ae8c080c0225592': 'minnie',
  '8d63d54a6fd4068ef18d34258ece2206': 'goofy',
  '4fbe601cebd93bfd54299ef718d5d342': 'pluto',
  'bbc0fa422418f51c28bbb299ae8cf9e1': 'goofy',
  'f83f080e729795c72e450b050a99bd8c': 'goofy',
  '4c720d7605bd167f715a8dbf6e317fce': 'mickey',
  '8c21a1042f3fa7f86f132265b34e2d26': 'donald',
  '75afffdc3c3750b6ce81136b4d189453': 'pluto',
  '1d88ee17f652de4623b85287ef37249e': 'chipp',
};

const askView = document.getElementById('askView');
const resultView = document.getElementById('resultView');
const nameInput = document.getElementById('nameInput');
const goBtn = document.getElementById('goBtn');
const againBtn = document.getElementById('againBtn');
const msgEl = document.getElementById('msg');
const cardEl = document.getElementById('card');
const cardSlot = document.getElementById('cardSlot');
const tablesEl = document.getElementById('tables');

function normalize(s) {
  return String(s || '')
    .trim()
    .replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[\s　・,、.。]/g, '')
    .toLowerCase();
}

function showMsg(html) {
  msgEl.innerHTML = html;
  msgEl.classList.add('show');
}

async function digestOf(text) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey(
    'raw', enc.encode(text), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: enc.encode(SALT), iterations: ITERATIONS, hash: 'SHA-256' },
    key, 128);
  return Array.from(new Uint8Array(bits))
    .map((b) => b.toString(16).padStart(2, '0')).join('');
}

let searching = false;

async function search() {
  if (searching) return;

  const name = normalize(nameInput.value);
  if (!name) {
    showMsg('お名前をひらがなでご入力ください。');
    return;
  }

  if (!(window.crypto && window.crypto.subtle)) {
    showMsg('この端末ではお名前を照合できませんでした。<br>別のブラウザでお試しください。');
    return;
  }

  searching = true;
  goBtn.disabled = true;
  goBtn.textContent = 'さがしています';

  try {
    const tableId = GUESTS[await digestOf(name)];

    if (!tableId || !TABLES[tableId]) {
      showMsg('お名前が見つかりませんでした。');
      return;
    }

    render(TABLES[tableId], tableId);
  } catch (e) {
    showMsg('照合できませんでした。<br>もう一度お試しください。');
  } finally {
    searching = false;
    goBtn.disabled = false;
    goBtn.textContent = 'さがす';
  }
}

function render(table, tableId) {
  msgEl.classList.remove('show');

  cardEl.style.setProperty('--frame', table.color || '#e04049');

  cardSlot.innerHTML = '';
  if (table.img) {
    const img = document.createElement('img');
    img.className = 'card-img';
    img.src = table.img;
    img.alt = 'あなたのテーブルは ' + table.label;
    cardSlot.appendChild(img);
  } else {
    const div = document.createElement('div');
    div.className = 'card-fallback';
    div.textContent = table.label;
    cardSlot.appendChild(div);
  }

  tablesEl.innerHTML = '';
  LAYOUT.forEach((row) => {
    const rowEl = document.createElement('div');
    rowEl.className = 'table-row';

    row.forEach((id) => {
      const seat = document.createElement('div');
      seat.className = 'seat' + (id === tableId ? ' mine' : '');

      if (id === tableId) {
        seat.innerHTML =
          '<span class="here">here!!' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
            'stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M6 4c6 2 10 7 11 15"/><path d="M12 18l5 1 0-6"/></svg>' +
          '</span>' +
          '<svg class="mark" viewBox="0 0 24 24" fill="currentColor">' +
            '<circle cx="5" cy="8.8" r="4.1"/><circle cx="19" cy="8.8" r="4.1"/>' +
            '<circle cx="12" cy="15" r="6.6"/></svg>';
      }

      rowEl.appendChild(seat);
    });

    tablesEl.appendChild(rowEl);
  });

  askView.hidden = true;
  resultView.hidden = false;
  cardEl.classList.add('framed');
  window.scrollTo(0, 0);

  resultView.classList.remove('play');
  void resultView.offsetWidth;
  resultView.classList.add('play');
}

goBtn.addEventListener('click', search);

nameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); search(); }
});

nameInput.addEventListener('input', () => msgEl.classList.remove('show'));

againBtn.addEventListener('click', () => {
  resultView.hidden = true;
  askView.hidden = false;
  cardEl.classList.remove('framed');
  nameInput.value = '';
  msgEl.classList.remove('show');
  nameInput.focus();
});
</script>

</body>
</html>
