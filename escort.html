<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fffaf3">
<title>Escort | Fumito &amp; Risa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --pink: #ff4f9d;
  --pink-soft: #ffd4e6;
  --purple: #a641e0;
  --grape: #7b34e0;
  --aqua: #1fc8c2;
  --gold: #ffbe2e;
  --cream: #fffaf3;
  --text: #3f3357;
  --text-light: #8a7fa0;
  --white: #ffffff;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans JP', sans-serif;
  color: var(--text);
  background: var(--cream);
  background-image:
    radial-gradient(circle at 12% 8%, rgba(255,212,230,0.55), transparent 42%),
    radial-gradient(circle at 88% 14%, rgba(166,65,224,0.14), transparent 45%),
    radial-gradient(circle at 50% 100%, rgba(31,200,194,0.14), transparent 55%);
  background-attachment: fixed;
  min-height: 100svh;
  display: flex;
  justify-content: center;
  padding: 48px 20px calc(env(safe-area-inset-bottom, 0px) + 56px);
  -webkit-text-size-adjust: 100%;
}

.wrap { width: 100%; max-width: 460px; text-align: center; }

.script {
  font-family: 'Great Vibes', cursive;
  font-size: 2.1rem;
  color: var(--purple);
  line-height: 1.2;
}

.date {
  font-size: 0.7rem;
  letter-spacing: 0.24em;
  color: var(--text-light);
  margin-top: 6px;
}

.section-label {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.5rem;
  letter-spacing: 0.2em;
  color: var(--purple);
  margin-top: 42px;
}

.divider {
  margin: 14px 0 0;
  font-size: 0.62rem;
  letter-spacing: 0.5em;
  color: var(--gold);
}

/* ── ここに中身を入れていく ── */
.card {
  margin-top: 32px;
  padding: 48px 28px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(4px);
  border: 1px solid var(--pink-soft);
  border-radius: 18px;
  box-shadow: 0 12px 40px rgba(150,110,200,0.15);
}

.placeholder {
  font-size: 0.82rem;
  line-height: 2.1;
  color: var(--text-light);
  letter-spacing: 0.04em;
}

footer {
  margin-top: 44px;
  font-size: 0.66rem;
  letter-spacing: 0.16em;
  color: var(--text-light);
}
</style>
</head>
<body>

<div class="wrap">

  <p class="script">Fumito &amp; Risa</p>
  <p class="date">2026 . 09 . 20</p>

  <p class="section-label">Escort</p>
  <div class="divider">✦ ✦ ✦</div>

  <!-- ここから中身を作っていきます -->
  <div class="card">
    <p class="placeholder">
      準備中です
    </p>
  </div>
  <!-- ここまで -->

  <footer>Fumito &amp; Risa &nbsp;·&nbsp; 2026.09.20</footer>

</div>

</body>
</html>
