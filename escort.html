<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fffaf3">
<title>Your Table | Fumito &amp; Risa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Caveat:wght@700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --red: #e0243c;
  --frame: #e04049;
  --pink: #ff6b96;
  --purple: #a641e0;
  --gold: #c9a227;
  --ink: #1a1a1a;
  --text: #3f3357;
  --text-light: #8a7fa0;
  --line: #d8cfe4;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: 'Noto Sans JP', sans-serif;
  color: var(--text);
  background: #fffaf3;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}

.stage {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
}

.wrap {
  width: 100%;
  max-width: 380px;
  margin: 0 auto;
}

/* ── カードの枠 ── */
.card {
  border: 2px solid var(--frame);
  border-radius: 16px;
  background: #fff;
  padding: clamp(16px, 4.5vw, 22px) clamp(13px, 3.6vw, 18px) clamp(18px, 4.5vw, 24px);
  box-shadow: 0 10px 30px rgba(224, 64, 73, 0.10);
}

/* ── 入力画面 ── */
.head { position: relative; }

.title {
  font-family: 'Playfair Display', serif;
  font-weight: 800;
  font-size: clamp(1.5rem, 7.6vw, 2rem);
  color: var(--ink);
  line-height: 1.1;
  white-space: nowrap;
}

.bird {
  position: absolute;
  right: -4px;
  top: -14px;
  width: clamp(46px, 15vw, 62px);
  transform: rotate(-6deg);
  pointer-events: none;
}

.ask-lead {
  margin-top: 30px;
  font-size: 0.82rem;
  line-height: 2;
  letter-spacing: 0.03em;
}

.ask-note { font-size: 0.71rem; color: var(--text-light); margin-top: 4px; }

.field {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  margin-top: 20px;
  padding: 16px 18px;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  background: #fff;
  font-family: inherit;
  font-size: 1.05rem;
  letter-spacing: 0.08em;
  text-align: center;
  color: var(--text);
}
.field:focus { outline: none; border-color: var(--purple); }
.field::placeholder { color: #c3bad3; letter-spacing: 0.06em; }

.go {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  margin-top: 14px;
  min-height: 60px;
  border: 0;
  border-radius: 999px;
  font-family: inherit;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: #fff;
  background: linear-gradient(135deg, var(--pink), var(--purple) 60%, #7b34e0);
  box-shadow: 0 10px 26px rgba(166,65,224,0.3);
  cursor: pointer;
  touch-action: manipulation;
}
.go:active { transform: scale(0.98); }

.msg {
  display: none;
  margin-top: 16px;
  padding: 13px 14px;
  border-radius: 12px;
  background: #fdecf2;
  color: #c22b58;
  font-size: 0.76rem;
  line-height: 1.9;
}
.msg.show { display: block; }

/* ── 結果画面 ── */
/* 上半分は画像そのまま。描画するのは卓の丸と here!! だけ */
.card-img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 50svh;
  object-fit: contain;
  margin: 0 auto;
}

.card-fallback {
  display: grid;
  place-items: center;
  min-height: 34svh;
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--red);
  letter-spacing: 0.06em;
}

/* here!! は丸の上に出るので、画像に重ならないだけの余白を取る */
.tables { margin-top: clamp(34px, 9vw, 48px); }

.table-row {
  display: flex;
  justify-content: center;
  gap: clamp(10px, 3.4vw, 16px);
}
.table-row + .table-row { margin-top: clamp(10px, 3vw, 15px); }

.seat {
  position: relative;
  width: clamp(52px, 16.5vw, 66px);
  aspect-ratio: 1;
  border: 1.6px solid var(--gold);
  border-radius: 50%;
  display: grid;
  place-items: center;
}

.seat.mine { border-color: var(--red); border-width: 2px; }
.seat.mine .mark { display: block; }

.mark {
  display: none;
  width: 56%;
  color: var(--ink);
}

.here {
  position: absolute;
  left: 50%;
  bottom: calc(100% + 5px);
  transform: translateX(-58%);
  font-family: 'Caveat', cursive;
  font-size: 1.16rem;
  color: var(--pink);
  white-space: nowrap;
  display: flex;
  align-items: flex-end;
  gap: 1px;
}
.here svg { width: 15px; margin-bottom: 1px; }

.again {
  -webkit-appearance: none;
  appearance: none;
  display: block;
  margin: clamp(12px, 3vw, 18px) auto 0;
  padding: 10px 26px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--text-light);
  font-family: inherit;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  cursor: pointer;
}

/* ── 登場アニメーション ── */
.play .card-img,
.play .card-fallback { animation: fadeUp 0.6s ease both; }
.play .tables { animation: fadeUp 0.6s ease 0.14s both; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.play .seat.mine .mark {
  animation: markPop 0.72s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s both;
}

@keyframes markPop {
  0%   { opacity: 0; transform: scale(0.25) rotate(-16deg); }
  55%  { opacity: 1; transform: scale(1.16) rotate(4deg); }
  100% { opacity: 1; transform: scale(1) rotate(0deg); }
}

.play .seat.mine::after {
  content: '';
  position: absolute;
  inset: -5px;
  border-radius: 50%;
  border: 2px solid var(--red);
  opacity: 0;
  animation: ring 1.3s ease-out 0.62s 2 both;
  pointer-events: none;
}

@keyframes ring {
  0%   { opacity: 0.7; transform: scale(0.82); }
  100% { opacity: 0;   transform: scale(1.3); }
}

.play .seat.mine .here {
  animation: hereIn 0.5s cubic-bezier(0.34, 1.4, 0.64, 1) 1.02s both;
}

@keyframes hereIn {
  from { opacity: 0; transform: translateX(-58%) translateY(-9px) rotate(-8deg); }
  to   { opacity: 1; transform: translateX(-58%) translateY(0) rotate(0deg); }
}

@media (prefers-reduced-motion: reduce) {
  .play .card-img,
  .play .card-fallback,
  .play .tables,
  .play .seat.mine .mark,
  .play .seat.mine .here { animation: none; }
  .play .seat.mine::after { display: none; }
}

[hidden] { display: none !important; }
</style>
</head>
<body>

<div class="stage">
<div class="wrap">
<div class="card">

  <!-- ================= 入力画面 ================= -->
  <section id="askView">
    <div class="head">
      <h1 class="title">Your Table is ...</h1>
      <img class="bird" src="img/bird.png" alt="">
    </div>

    <p class="ask-lead">
      お名前を <strong>ひらがな</strong> でご入力ください<br>
      <span class="ask-note">例：やまだ たろう</span>
    </p>

    <input class="field" id="nameInput" type="text" autocomplete="off"
           autocapitalize="off" spellcheck="false" placeholder="やまだ たろう">

    <button type="button" class="go" id="goBtn">さがす</button>

    <p class="msg" id="msg"></p>
  </section>

  <!-- ================= 結果画面 ================= -->
  <section id="resultView" hidden>
    <div id="cardSlot"></div>
    <div class="tables" id="tables"></div>
    <button type="button" class="again" id="againBtn">もう一度さがす</button>
  </section>

</div>
</div>
</div>

<script>
/* ============================================================
   1) テーブルの設定
      img に escort_img の画像を置くと、そのまま表示されます。
      画像がない卓は、卓名を文字で表示します。
      （★卓名は仮。実際のものに差し替えます）
   ============================================================ */
const TABLES = {
  mickey: { label: 'ミッキーマウス', img: 'escort_img/mickey.png' },
  minnie: { label: 'ミニーマウス',   img: '' },
  donald: { label: 'ドナルドダック', img: '' },
  daisy:  { label: 'デイジーダック', img: '' },
  goofy:  { label: 'グーフィー',     img: '' },
  pluto:  { label: 'プルート',       img: '' },
  chip:   { label: 'チップとデール', img: '' },
};

/* 会場の並び。実際の配置に合わせて並べ替えます */
const LAYOUT = [
  ['mickey', 'minnie', 'donald', 'daisy'],
  ['goofy', 'pluto', 'chip'],
];

/* ============================================================
   2) ゲスト名簿（★仮データ：53名の実際のお名前に差し替えます）
      キーはひらがな。姓名の間の空白は無視されます。
   ============================================================ */
const GUESTS = {
  'やまだたろう':   'mickey',
  'やまだはなこ':   'mickey',
  'すずきいちろう': 'minnie',
  'たなかさくら':   'donald',
  'さとうけんた':   'daisy',
  'いとうみさき':   'goofy',
  'わたなべゆうき': 'pluto',
  'なかむらあおい': 'chip',
};

/* ============================================================ */

const askView = document.getElementById('askView');
const resultView = document.getElementById('resultView');
const nameInput = document.getElementById('nameInput');
const goBtn = document.getElementById('goBtn');
const againBtn = document.getElementById('againBtn');
const msgEl = document.getElementById('msg');
const cardSlot = document.getElementById('cardSlot');
const tablesEl = document.getElementById('tables');

/* カタカナ・空白・記号を吸収してから照合する */
function normalize(s) {
  return String(s || '')
    .trim()
    .replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[\s　・,、.。]/g, '')
    .toLowerCase();
}

function showMsg(html) {
  msgEl.innerHTML = html;
  msgEl.classList.add('show');
}

function search() {
  const key = normalize(nameInput.value);

  if (!key) {
    showMsg('お名前をひらがなでご入力ください。');
    return;
  }

  const tableId = GUESTS[key];
  if (!tableId || !TABLES[tableId]) {
    showMsg(
      'お名前が見つかりませんでした。<br>' +
      'ひらがなでご入力いただいているかご確認ください。<br>' +
      'それでも出ない場合は、会場スタッフにお声がけください。'
    );
    return;
  }

  render(TABLES[tableId], tableId);
}

function render(table, tableId) {
  msgEl.classList.remove('show');

  /* 上半分は画像をそのまま置く */
  cardSlot.innerHTML = '';
  if (table.img) {
    const img = document.createElement('img');
    img.className = 'card-img';
    img.src = table.img;
    img.alt = 'あなたのテーブルは ' + table.label;
    cardSlot.appendChild(img);
  } else {
    const div = document.createElement('div');
    div.className = 'card-fallback';
    div.textContent = table.label;
    cardSlot.appendChild(div);
  }

  /* 卓の丸と here!! だけを描画する */
  tablesEl.innerHTML = '';
  LAYOUT.forEach((row) => {
    const rowEl = document.createElement('div');
    rowEl.className = 'table-row';

    row.forEach((id) => {
      const seat = document.createElement('div');
      seat.className = 'seat' + (id === tableId ? ' mine' : '');

      if (id === tableId) {
        seat.innerHTML =
          '<span class="here">here!!' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
            'stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M6 4c6 2 10 7 11 15"/><path d="M12 18l5 1 0-6"/></svg>' +
          '</span>' +
          '<svg class="mark" viewBox="0 0 24 24" fill="currentColor">' +
            '<circle cx="5.6" cy="6.4" r="4.1"/><circle cx="18.4" cy="6.4" r="4.1"/>' +
            '<circle cx="12" cy="15" r="6.6"/></svg>';
      }

      rowEl.appendChild(seat);
    });

    tablesEl.appendChild(rowEl);
  });

  askView.hidden = true;
  resultView.hidden = false;
  window.scrollTo(0, 0);

  // 何度さがしても毎回アニメーションが動くようにする
  resultView.classList.remove('play');
  void resultView.offsetWidth;
  resultView.classList.add('play');
}

goBtn.addEventListener('click', search);

nameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); search(); }
});

nameInput.addEventListener('input', () => msgEl.classList.remove('show'));

againBtn.addEventListener('click', () => {
  resultView.hidden = true;
  askView.hidden = false;
  nameInput.value = '';
  msgEl.classList.remove('show');
  nameInput.focus();
});
</script>

</body>
</html>
