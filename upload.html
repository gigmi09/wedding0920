<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="theme-color" content="#fffaf3">
<title>写真・動画のご提供 | Fumito &amp; Risa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --pink: #ff4f9d;
  --pink-soft: #ffd4e6;
  --purple: #a641e0;
  --grape: #7b34e0;
  --aqua: #1fc8c2;
  --gold: #ffbe2e;
  --cream: #fffaf3;
  --text: #3f3357;
  --text-light: #8a7fa0;
  --white: #ffffff;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans JP', sans-serif;
  color: var(--text);
  background: var(--cream);
  background-image:
    radial-gradient(circle at 12% 8%, rgba(255,212,230,0.55), transparent 42%),
    radial-gradient(circle at 88% 14%, rgba(166,65,224,0.14), transparent 45%),
    radial-gradient(circle at 50% 100%, rgba(31,200,194,0.14), transparent 55%);
  background-attachment: fixed;
  min-height: 100svh;
  display: flex;
  justify-content: center;
  padding: 40px 20px calc(env(safe-area-inset-bottom, 0px) + 48px);
  -webkit-text-size-adjust: 100%;
}

.wrap { width: 100%; max-width: 460px; text-align: center; }

.script {
  font-family: 'Great Vibes', cursive;
  font-size: 2.1rem;
  color: var(--purple);
  line-height: 1.2;
}

.date {
  font-size: 0.7rem;
  letter-spacing: 0.24em;
  color: var(--text-light);
  margin-top: 6px;
}

h1 {
  font-size: 1.02rem;
  font-weight: 500;
  letter-spacing: 0.06em;
  margin-top: 30px;
  line-height: 1.9;
}

.lead {
  font-size: 0.8rem;
  line-height: 2;
  color: var(--text-light);
  margin-top: 14px;
}

/* ── アップロードボタン ── */
.upload-btn {
  -webkit-appearance: none;
  appearance: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  min-height: 96px;
  margin: 40px 0 0;
  padding: 0 24px;
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  font-family: inherit;
  font-size: 1.32rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--white);
  background: linear-gradient(135deg, var(--pink), var(--purple) 55%, var(--grape));
  box-shadow: 0 14px 34px rgba(166,65,224,0.34);
  transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
  touch-action: manipulation;
}

.upload-btn:active { transform: scale(0.975); box-shadow: 0 8px 20px rgba(166,65,224,0.3); }
.upload-btn:disabled { opacity: 0.5; cursor: default; transform: none; }
.upload-btn svg { width: 27px; height: 27px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

.hint { font-size: 0.72rem; color: var(--text-light); margin-top: 16px; letter-spacing: 0.05em; line-height: 1.9; }

.tips {
  margin-top: 26px;
  padding: 16px 18px;
  border-radius: 12px;
  background: rgba(255,255,255,0.7);
  border: 1px solid var(--pink-soft);
  text-align: left;
}

.tips li {
  list-style: none;
  position: relative;
  padding-left: 18px;
  font-size: 0.72rem;
  line-height: 1.95;
  color: var(--text-light);
}

.tips li + li { margin-top: 7px; }

.tips li::before {
  content: '✦';
  position: absolute;
  left: 0;
  top: 0;
  color: var(--purple);
  font-size: 0.62rem;
}

.now-uploading {
  display: none;
  margin-top: 22px;
  padding: 13px 16px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--pink-soft), #e0e8ff);
  color: var(--purple);
  font-size: 0.76rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  line-height: 1.8;
}
.now-uploading.show { display: block; }

/* ── お名前の入力 ── */
.ask-name {
  margin-top: 34px;
  font-size: 0.95rem;
  font-weight: 500;
  letter-spacing: 0.05em;
}

.ask-note {
  margin-top: 6px;
  font-size: 0.75rem;
  color: var(--text-light);
  letter-spacing: 0.05em;
}

.field {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  margin-top: 18px;
  padding: 16px 18px;
  border: 1.5px solid var(--pink-soft);
  border-radius: 14px;
  background: #fff;
  font-family: inherit;
  font-size: 1.05rem;
  letter-spacing: 0.06em;
  text-align: center;
  color: var(--text);
}
.field:focus { outline: none; border-color: var(--purple); }
.field::placeholder { color: #d8cbe4; }

.next-btn {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  margin-top: 14px;
  min-height: 62px;
  border: 0;
  border-radius: 999px;
  font-family: inherit;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: #fff;
  background: linear-gradient(135deg, var(--pink), var(--purple) 60%, var(--grape));
  box-shadow: 0 10px 26px rgba(166,65,224,0.3);
  cursor: pointer;
  touch-action: manipulation;
}
.next-btn:active { transform: scale(0.98); }

.msg {
  display: none;
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 12px;
  background: #fdecf2;
  color: #c22b58;
  font-size: 0.76rem;
  line-height: 1.8;
}
.msg.show { display: block; }

/* ── 送信者の表示 ── */
.who {
  margin-top: 30px;
  font-size: 0.95rem;
  line-height: 1.9;
  letter-spacing: 0.04em;
}
.who b {
  font-weight: 700;
  color: var(--purple);
  word-break: break-all;
}

.change {
  -webkit-appearance: none;
  appearance: none;
  margin-top: 26px;
  padding: 9px 22px;
  border: 1px solid var(--pink-soft);
  border-radius: 999px;
  background: transparent;
  color: var(--text-light);
  font-family: inherit;
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  cursor: pointer;
}

[hidden] { display: none !important; }

/* ── ファイル一覧 ── */
.list { margin-top: 32px; text-align: left; display: none; }
.list.show { display: block; }

.item {
  background: rgba(255,255,255,0.9);
  border: 1px solid var(--pink-soft);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: 0 6px 18px rgba(150,110,200,0.09);
}

.item-head { display: flex; align-items: center; gap: 10px; }
.item-name {
  flex: 1; min-width: 0;
  font-size: 0.78rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.item-state { font-size: 0.7rem; color: var(--text-light); white-space: nowrap; letter-spacing: 0.04em; }
.item.done .item-state { color: var(--aqua); font-weight: 500; }
.item.error .item-state { color: var(--pink); font-weight: 500; }

.item-err {
  display: none;
  margin-top: 8px;
  font-size: 0.68rem;
  line-height: 1.7;
  color: #d33b73;
  word-break: break-all;
}
.item.error .item-err { display: block; }

.bar { height: 5px; border-radius: 99px; background: var(--pink-soft); margin-top: 10px; overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--pink), var(--purple)); transition: width 0.25s ease; }
.item.done .bar span { background: linear-gradient(90deg, var(--aqua), var(--gold)); }
.item.error .bar span { background: var(--pink); }

/* ── 完了メッセージ ── */
.result {
  display: none;
  margin-top: 26px;
  padding: 22px 18px;
  border-radius: 14px;
  font-size: 0.85rem;
  line-height: 2;
  background: linear-gradient(135deg, var(--pink-soft), #e0e8ff);
  color: var(--purple);
}
.result.show { display: block; }
.result.bad { background: #fdecf2; color: #d33b73; }

.retry {
  -webkit-appearance: none; appearance: none;
  margin-top: 14px; padding: 11px 26px;
  border: 1px solid var(--purple); border-radius: 999px;
  background: transparent; color: var(--purple);
  font-family: inherit; font-size: 0.78rem; letter-spacing: 0.08em;
  cursor: pointer;
}

footer { margin-top: 44px; font-size: 0.66rem; letter-spacing: 0.16em; color: var(--text-light); }

@media (max-width: 380px) {
  .upload-btn { font-size: 1.18rem; min-height: 86px; }
}
</style>
</head>
<body>

<div class="wrap">

  <p class="script">Fumito &amp; Risa</p>
  <p class="date">2026 . 09 . 20</p>

  <section id="nameView">

    <h1>当日のお写真・動画を<br>お寄せください</h1>
    <p class="lead">
      みなさまが撮ってくださった一枚が<br>
      わたしたちの宝物になります
    </p>

    <p class="ask-name">お名前を教えてください</p>
    <p class="ask-note">ニックネームOK！</p>

    <input class="field" id="senderInput" type="text" autocomplete="off"
           autocapitalize="off" spellcheck="false" maxlength="40" placeholder="おなまえ">

    <button type="button" class="next-btn" id="nextBtn">つぎへ</button>

    <p class="msg" id="nameMsg"></p>

  </section>

  <section id="uploadView" hidden>

  <p class="who"><b id="whoName"></b> さん<br>ありがとうございます</p>

  <button type="button" class="upload-btn" id="pickBtn">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 16V4"></path>
      <path d="M7 9l5-5 5 5"></path>
      <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path>
    </svg>
    アップロード
  </button>

  <input type="file" id="fileInput" accept="image/*,video/*" multiple hidden>

  <p class="hint">写真ライブラリから何枚でも選べます<br>動画もそのままお送りいただけます</p>

  <ul class="tips">
    <li>送信中は画面を消さずにそのままお待ちください</li>
    <li>本数が多いときは、何回かに分けると失敗しにくいです</li>
  </ul>

  <div class="now-uploading" id="nowUploading">
    送信中です。画面を消さずにお待ちください。
  </div>

  <div class="list" id="list"></div>
  <div class="result" id="result"></div>

  <button type="button" class="change" id="changeBtn">お名前を変更する</button>

  </section>

  <footer>THANK YOU</footer>

</div>

<script>
/* ============================================================
   Google Apps Script のウェブアプリ URL をここに貼ってください
   （デプロイ後に発行される .../exec で終わる URL）
   ============================================================ */
const UPLOAD_GAS_URL = 'https://script.google.com/macros/s/AKfycbzUZw-dUX4tkMTBSUcyUkwgJZk07Ptw3Mz8Q1YrAZligWqnkMtkojbrnAYt-gaITBWC/exec';

const nameView = document.getElementById('nameView');
const uploadView = document.getElementById('uploadView');
const senderInput = document.getElementById('senderInput');
const nextBtn = document.getElementById('nextBtn');
const nameMsg = document.getElementById('nameMsg');
const whoName = document.getElementById('whoName');
const changeBtn = document.getElementById('changeBtn');
const pickBtn = document.getElementById('pickBtn');
const fileInput = document.getElementById('fileInput');
const listEl = document.getElementById('list');
const nowEl = document.getElementById('nowUploading');
const NOW_TEXT = nowEl.textContent.trim();
const resultEl = document.getElementById('result');

const MAX_ATTEMPTS = 3;
const PARALLEL = 3;
const SESSION_AHEAD = 4;
const SENDER_KEY = 'wedding0920_sender';

let sender = '';

function cleanName(v) {
  return String(v || '').replace(/[\r\n\t]/g, ' ').trim().slice(0, 40);
}

function rememberSender(v) {
  try { localStorage.setItem(SENDER_KEY, v); } catch (e) { /* 保存できなくても続行 */ }
}

function recallSender() {
  try { return localStorage.getItem(SENDER_KEY) || ''; } catch (e) { return ''; }
}

function toUploadView(name) {
  sender = name;
  whoName.textContent = name;
  nameMsg.classList.remove('show');
  nameView.hidden = true;
  uploadView.hidden = false;
}

function toNameView() {
  uploadView.hidden = true;
  nameView.hidden = false;
  senderInput.value = sender;
  senderInput.focus();
}

nextBtn.addEventListener('click', () => {
  const v = cleanName(senderInput.value);
  if (!v) {
    nameMsg.textContent = 'お名前を入れてください。';
    nameMsg.classList.add('show');
    return;
  }
  rememberSender(v);
  toUploadView(v);
});

senderInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); nextBtn.click(); }
});

senderInput.addEventListener('input', () => nameMsg.classList.remove('show'));

changeBtn.addEventListener('click', () => {
  if (uploading) return;
  toNameView();
});

(function restore() {
  const saved = cleanName(recallSender());
  if (saved) toUploadView(saved);
})();

// 種類が空で渡ってくる端末があるため、拡張子でも判断できるようにする
const MEDIA_EXT = /\.(jpe?g|png|gif|webp|avif|bmp|tiff?|heic|heif|mov|mp4|m4v|3gp|avi|mkv|webm|mpe?g|wmv)$/i;

function isMedia(file) {
  const t = String(file.type || '').toLowerCase();
  if (t.indexOf('image/') === 0 || t.indexOf('video/') === 0) return true;
  if (!t) return MEDIA_EXT.test(file.name || '');
  return false;
}
let uploading = false;

pickBtn.addEventListener('click', () => {
  if (uploading) return;
  fileInput.click();
});

fileInput.addEventListener('change', () => {
  const all = Array.from(fileInput.files || []);
  // 送信し終わるまで input は空にしない。
  // iOS では先に空にすると写真の実体が読めなくなることがある。
  if (!all.length) return;

  const files = all.filter(isMedia);
  const skipped = all.filter((f) => !isMedia(f));
  start(files, skipped);
});

function show(msg, bad) {
  resultEl.innerHTML = msg;
  resultEl.className = 'result show' + (bad ? ' bad' : '');
}

function fmtSize(n) {
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}

function addRow(file) {
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML =
    '<div class="item-head">' +
      '<span class="item-name"></span>' +
      '<span class="item-state">待機中</span>' +
    '</div>' +
    '<div class="bar"><span></span></div>' +
    '<p class="item-err"></p>';
  el.querySelector('.item-name').textContent = file.name + '（' + fmtSize(file.size) + '）';
  listEl.appendChild(el);
  return {
    root: el,
    state: el.querySelector('.item-state'),
    fill: el.querySelector('.bar span'),
    err: el.querySelector('.item-err'),
  };
}

function markSkipped(file) {
  const row = addRow(file);
  row.root.classList.add('error');
  row.state.textContent = '対象外';
  row.fill.style.width = '100%';
  row.err.textContent = '写真と動画のみお送りいただけます';
}


async function start(files, skipped) {
  skipped = skipped || [];

  if (UPLOAD_GAS_URL.indexOf('PASTE_YOUR') === 0) {
    show('アップロード先がまだ設定されていません。<br>新郎新婦までお知らせください。', true);
    return;
  }

  if (!files.length) {
    listEl.classList.add('show');
    skipped.forEach(markSkipped);
    fileInput.value = '';
    show('写真と動画のみお送りいただけます。<br>選び直してください。' +
      '<button type="button" class="retry" onclick="document.getElementById(\'pickBtn\').click()">もう一度選ぶ</button>',
      true);
    return;
  }

  uploading = true;
  pickBtn.disabled = true;
  resultEl.className = 'result';
  listEl.classList.add('show');
  nowEl.textContent = NOW_TEXT;
  nowEl.classList.add('show');
  skipped.forEach(markSkipped);
  window.addEventListener('beforeunload', warn);

  const rows = files.map(addRow);
  const sessionFor = sessionPipeline(files, SESSION_AHEAD);

  const sent = [];
  const failed = [];
  let firstError = '';

  function markFailed(i, msg) {
    const row = rows[i];
    row.root.classList.remove('done');
    row.root.classList.add('error');
    row.state.textContent = '失敗';
    row.fill.style.width = '100%';
    row.err.textContent = msg;
    failed.push(files[i].name);
    if (!firstError) firstError = msg;
  }

  await runPool(files, async (i) => {
    try {
      const done = await uploadOne(files[i], rows[i], sessionFor, i);
      rows[i].root.classList.add('done');
      rows[i].state.textContent = '完了';
      rows[i].fill.style.width = '100%';
      sent.push({ index: i, name: done.name, confirmed: done.confirmed });
    } catch (err) {
      markFailed(i, String((err && err.message) || err));
    }
  });

  // 送り終えたぶんを、最後にまとめて1回だけ確認する
  const pending = sent.filter((x) => !x.confirmed && x.name);
  if (pending.length) {
    nowEl.textContent = '保存を確認しています';
    const found = await verifyAll(pending.map((x) => x.name));
    for (const x of pending) {
      if (!found.has(x.name)) markFailed(x.index, '保存を確認できませんでした');
    }
  }

  uploading = false;
  pickBtn.disabled = false;
  fileInput.value = '';
  nowEl.classList.remove('show');
  nowEl.textContent = NOW_TEXT;
  window.removeEventListener('beforeunload', warn);

  const okCount = rows.filter((r) => r.root.classList.contains('done')).length;

  const skipNote = skipped.length
    ? '<br>写真と動画以外の' + skipped.length + '件は送っていません'
    : '';

  if (!failed.length) {
    show(
      okCount + '件をお送りいただきました<br>' +
      'ありがとうございます！<br>' +
      '続けてアップロードもできます' + skipNote
    );
  } else {
    const esc = document.createElement('span');
    esc.textContent = firstError;
    show(
      okCount + '件は完了しましたが、' + failed.length + '件が失敗しました。<br>' +
      '電波の良い場所でもう一度お試しください。' + skipNote +
      '<span style="display:block;margin-top:10px;font-size:0.7rem;opacity:0.85;word-break:break-all">' +
      esc.innerHTML + '</span>' +
      '<button type="button" class="retry" onclick="document.getElementById(\'pickBtn\').click()">もう一度選ぶ</button>',
      true
    );
  }
}


/* 決まった数だけ並行して処理する */
async function runPool(files, handle) {
  let next = 0;

  async function worker() {
    for (;;) {
      const i = next++;
      if (i >= files.length) return;
      await handle(i);
    }
  }

  const workers = [];
  const width = Math.min(PARALLEL, files.length);
  for (let k = 0; k < width; k++) workers.push(worker());
  await Promise.all(workers);
}


/* 送信先URLを先回りして取っておく。転送中に次のURLが揃う */
function sessionPipeline(files, ahead) {
  const cache = new Map();
  let next = 0;
  let active = 0;

  function pump() {
    while (active < ahead && next < files.length) {
      const i = next++;
      active++;
      const p = createSession(files[i]);
      cache.set(i, p);
      p.then(
        () => { active--; pump(); },
        () => { active--; pump(); }
      );
    }
  }

  pump();

  return function (i) {
    if (!cache.has(i)) cache.set(i, createSession(files[i]));
    return cache.get(i);
  };
}


function warn(e) {
  e.preventDefault();
  e.returnValue = '';
}

/* GAS に依頼して Drive の再開可能アップロード用 URL を発行してもらう */
async function createSession(file) {
  const res = await fetch(UPLOAD_GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      action: 'start',
      name: file.name,
      mimeType: file.type || 'application/octet-stream',
      size: file.size,
      sender: sender,
    }),
  });
  if (!res.ok) throw new Error('URL発行に失敗 HTTP ' + res.status);

  const raw = await res.text();
  let data;
  try {
    data = JSON.parse(raw);
  } catch (e) {
    throw new Error('想定外の応答: ' + raw.slice(0, 160));
  }
  if (!data.ok || !data.uploadUrl) {
    throw new Error(data.error || 'アップロードURLが返りませんでした');
  }
  return { uploadUrl: data.uploadUrl, name: data.name || '' };
}

/* 1ファイルを送る。失敗しても最大3回まで自動でやり直す */
async function uploadOne(file, row, sessionFor, index) {
  let lastError;

  for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
    try {
      row.state.textContent = attempt === 1 ? '準備中' : '再送信中';
      row.fill.style.width = '0%';

      const session = attempt === 1
        ? await sessionFor(index)
        : await createSession(file);

      row.state.textContent = '0%';
      const how = await putFile(session.uploadUrl, file, (pct) => {
        row.state.textContent = pct + '%';
        row.fill.style.width = pct + '%';
      });

      return { name: session.name, confirmed: how === 'confirmed' };
    } catch (err) {
      lastError = err;
      if (attempt < MAX_ATTEMPTS) {
        row.state.textContent = 'やり直します';
        await sleep(attempt * 2000);
      }
    }
  }

  throw lastError;
}


function sleep(ms) {
  return new Promise((r) => setTimeout(r, ms));
}


/* 本当に Drive に保存できたかを GAS に問い合わせる */
async function verifyAll(names) {
  const found = new Set();
  if (!names.length) return found;

  let missing = names.slice();

  for (let round = 0; round < 2 && missing.length; round++) {
    if (round) await sleep(1500);
    const hit = await askFound(missing);
    hit.forEach((n) => found.add(n));
    missing = missing.filter((n) => !found.has(n));
  }

  return found;
}


/* まとめて問い合わせる。古いバックエンドなら1件ずつ並行で聞く */
async function askFound(names) {
  try {
    const res = await fetch(UPLOAD_GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'verifyMany', names: names, sender: sender }),
    });
    const data = await res.json();
    if (data && data.ok && Array.isArray(data.found)) return data.found;
  } catch (e) {
    /* 1件ずつに切り替える */
  }

  const each = await Promise.all(names.map((n) => verifyOne(n).then((ok) => (ok ? n : null))));
  return each.filter(Boolean);
}


async function verifyOne(name) {
  try {
    const res = await fetch(UPLOAD_GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'verify', name: name, sender: sender }),
    });
    const data = await res.json();
    return !!(data && data.ok && data.found);
  } catch (e) {
    return false;
  }
}


/* ファイル本体はブラウザから Google へ直接送る（GAS を経由しないので大きな動画も通る） */
function putFile(uploadUrl, file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    let sentAll = false;

    xhr.open('PUT', uploadUrl, true);
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');

    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      if (e.loaded >= e.total) sentAll = true;
      onProgress(Math.min(99, Math.floor((e.loaded / e.total) * 100)));
    };
    xhr.upload.onload = () => { sentAll = true; };

    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve('confirmed');
      else reject(new Error('送信に失敗 HTTP ' + xhr.status + ' ' +
        String(xhr.responseText || '').slice(0, 160)));
    };

    // Google は完了の応答にブラウザ向けの許可ヘッダを付けてこない。
    // 全部送り終えたあとのエラーは成功とみなし、最後にまとめて確かめる。
    xhr.onerror = () => {
      if (sentAll) resolve('sent');
      else reject(new Error('送信中に通信が途切れました（回線が不安定です）'));
    };
    xhr.ontimeout = () => {
      if (sentAll) resolve('sent');
      else reject(new Error('送信がタイムアウトしました'));
    };

    xhr.send(file);
  });
}
